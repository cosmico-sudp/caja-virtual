<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#17654f">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24'%3E%3Crect width='24' height='24' rx='6' fill='%2317654f'/%3E%3Cpath d='M6 11h12v8H6zM8 11V7h8v4' fill='none' stroke='white' stroke-width='2'/%3E%3C/svg%3E">
<style>:root{color-scheme:light;padding-top:env(safe-area-inset-top);padding-bottom:env(safe-area-inset-bottom)}body{margin:0;font:14px system-ui,sans-serif}img{max-width:100%}[hidden]{display:none!important}</style>
<title>Caja Virtual</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,800&family=Figtree:wght@400;500;600;700&family=JetBrains+Mono:wght@400;600&display=swap">
<style>
/* Layout: punto de venta de mostrador — barra fija arriba, mesas como fichas, pedido a la derecha como ticket */
:root{
  --bg:#eaefec; --surface:#ffffff; --sunk:#dfe6e2; --ink:#14201b; --muted:#56675f; --line:#cfd9d3;
  --accent:#17654f; --accent-ink:#ffffff; --accent-soft:#d3e9e0;
  --paper:#fffdf6; --paper-ink:#1d1d1b; --paper-line:#c9c4b5;
  --ok:#1c7445; --ok-soft:#d9f0e2; --warn:#975400; --warn-soft:#fae6c3; --bad:#b3261e; --bad-soft:#f7dad7;
  --shadow:0 1px 2px rgba(20,32,27,.08),0 6px 18px rgba(20,32,27,.06);
  --f-display:'Bricolage Grotesque',ui-sans-serif,system-ui,sans-serif;
  --f-body:'Figtree',ui-sans-serif,system-ui,-apple-system,'Segoe UI',sans-serif;
  --f-mono:'JetBrains Mono',ui-monospace,'SFMono-Regular',Menlo,Consolas,monospace;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0f1513; --surface:#17201c; --sunk:#0b100e; --ink:#e5ede9; --muted:#93a59c; --line:#28342f;
  --accent:#4cbf96; --accent-ink:#04241a; --accent-soft:#163a2e;
  --paper:#f3f0e6; --paper-ink:#1d1d1b; --paper-line:#bdb7a6;
  --ok:#5fcf91; --ok-soft:#14372a; --warn:#f1b552; --warn-soft:#3a2a10; --bad:#ff8b80; --bad-soft:#3e1916;
  --shadow:0 1px 2px rgba(0,0,0,.4),0 6px 18px rgba(0,0,0,.25);
  color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0f1513; --surface:#17201c; --sunk:#0b100e; --ink:#e5ede9; --muted:#93a59c; --line:#28342f;
  --accent:#4cbf96; --accent-ink:#04241a; --accent-soft:#163a2e;
  --paper:#f3f0e6; --paper-ink:#1d1d1b; --paper-line:#bdb7a6;
  --ok:#5fcf91; --ok-soft:#14372a; --warn:#f1b552; --warn-soft:#3a2a10; --bad:#ff8b80; --bad-soft:#3e1916;
  --shadow:0 1px 2px rgba(0,0,0,.4),0 6px 18px rgba(0,0,0,.25);
  color-scheme:dark}

*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font:15px/1.45 var(--f-body)}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--surface)}
button,input,select{font:inherit;color:inherit}
.num,.mono{font-variant-numeric:tabular-nums}
.mono{font-family:var(--f-mono)}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}

.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--surface);border-bottom:1px solid var(--line);
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:10px}
.top-in{max-width:1240px;margin:0 auto;display:flex;flex-wrap:wrap;align-items:center;gap:10px 18px}
.brand{display:flex;align-items:center;gap:10px;min-width:0}
.logo{width:34px;height:34px;border-radius:9px;background:var(--accent);color:var(--accent-ink);display:grid;place-items:center;flex:none}
.brand b{font-family:var(--f-display);font-weight:800;font-size:18px;display:block;line-height:1.1;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:42vw}
.brand small{color:var(--muted);font-size:12px;letter-spacing:.06em;text-transform:uppercase}
.tabs{display:flex;gap:4px;background:var(--sunk);padding:4px;border-radius:11px;order:3;width:100%;overflow-x:auto}
.tab{flex:1;border:0;background:transparent;padding:8px 12px;border-radius:8px;font-weight:600;color:var(--muted);cursor:pointer;white-space:nowrap}
.tab[aria-current="page"]{background:var(--surface);color:var(--ink);box-shadow:var(--shadow)}
.status{display:flex;gap:8px;margin-left:auto;align-items:center}
@media (min-width:860px){.tabs{order:0;width:auto}.tab{flex:none}}

.pill{display:inline-flex;align-items:center;gap:6px;padding:4px 10px;border-radius:99px;font-size:12.5px;font-weight:600;white-space:nowrap;border:0}
.pill::before{content:"";width:7px;height:7px;border-radius:50%;background:currentColor}
.pill.ok{background:var(--ok-soft);color:var(--ok)} .pill.warn{background:var(--warn-soft);color:var(--warn)}
.pill.bad{background:var(--bad-soft);color:var(--bad)} .pill.neutral{background:var(--sunk);color:var(--muted)}
button.pill{cursor:pointer}

main{padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:18px 60px}
.wrap{max-width:1240px;margin:0 auto;display:flex;flex-direction:column;gap:18px}
h1,h2,h3{font-family:var(--f-display);margin:0;text-wrap:balance}
h2{font-size:22px;font-weight:800} h3{font-size:16px;font-weight:600}
.lbl{font-size:11.5px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);font-weight:600}
.muted{color:var(--muted)}
.row{display:flex;flex-wrap:wrap;gap:10px;align-items:center}
.spacer{flex:1}

.btn{border:1px solid var(--line);background:var(--surface);padding:9px 14px;border-radius:10px;font-weight:600;cursor:pointer;display:inline-flex;align-items:center;gap:6px;justify-content:center}
.btn:hover{border-color:var(--muted)}
.btn.primary{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.btn.primary:hover{filter:brightness(1.08)}
.btn.danger{color:var(--bad);border-color:var(--bad-soft)}
.btn.big{padding:13px 18px;font-size:16px}
.btn.sm{padding:5px 10px;font-size:13px;border-radius:8px}
.btn:disabled{opacity:.45;cursor:not-allowed;filter:none}
.btn.block{width:100%}
input.in,select.in{width:100%;border:1px solid var(--line);background:var(--surface);border-radius:10px;padding:9px 12px}
input.in:focus{border-color:var(--accent);outline:none;box-shadow:0 0 0 3px var(--accent-soft)}
.field{display:flex;flex-direction:column;gap:5px}
.field label{font-size:13px;font-weight:600;color:var(--muted)}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:12px}
@media (max-width:480px){.grid2{grid-template-columns:1fr}}

.banner{display:flex;flex-wrap:wrap;gap:10px;align-items:center;padding:12px 14px;border-radius:12px;font-weight:500}
.banner.warn{background:var(--warn-soft);color:var(--warn)} .banner.bad{background:var(--bad-soft);color:var(--bad)}
.banner.info{background:var(--accent-soft);color:var(--ink)}
.banner .btn{margin-left:auto}

/* Mesas */
.mesas{display:grid;grid-template-columns:repeat(6,minmax(0,1fr));gap:10px}
@media (max-width:900px){.mesas{grid-template-columns:repeat(3,minmax(0,1fr))}}
.mesa{border:1px solid var(--line);background:var(--surface);border-radius:14px;padding:12px;text-align:left;cursor:pointer;display:flex;flex-direction:column;gap:6px;min-height:104px;position:relative}
.mesa .n{font-family:var(--f-display);font-weight:800;font-size:20px;line-height:1}
.mesa .t{font-family:var(--f-mono);font-size:13px;margin-top:auto}
.mesa.busy{background:var(--accent-soft);border-color:transparent}
.mesa.cobro{background:var(--warn-soft);border-color:transparent}
.mesa[aria-pressed="true"]{outline:2.5px solid var(--accent);outline-offset:1px}
.mesa .st{font-size:12px;font-weight:600;color:var(--muted)}
.mesa.busy .st{color:var(--accent)} .mesa.cobro .st{color:var(--warn)}

.work{display:grid;grid-template-columns:minmax(0,1.5fr) minmax(0,1fr);gap:18px;align-items:start}
@media (max-width:860px){.work{grid-template-columns:1fr}}
.panel{background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:16px;display:flex;flex-direction:column;gap:14px;min-width:0}
.chips{display:flex;gap:6px;flex-wrap:wrap}
.chip{border:1px solid var(--line);background:transparent;border-radius:99px;padding:5px 12px;font-size:13px;font-weight:600;cursor:pointer;color:var(--muted)}
.chip[aria-pressed="true"]{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.prods{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:8px}
.prod{border:1px solid var(--line);background:var(--bg);border-radius:12px;padding:10px 11px;text-align:left;cursor:pointer;display:flex;flex-direction:column;gap:3px;min-width:0}
.prod:hover:not(:disabled){border-color:var(--accent)}
.prod b{font-weight:600;font-size:14px;line-height:1.25}
.prod .p{font-family:var(--f-mono);font-size:13px}
.prod .s{font-size:12px;color:var(--muted)}
.prod .s.warn{color:var(--warn);font-weight:600} .prod .s.bad{color:var(--bad);font-weight:600}
.prod:disabled{opacity:.5;cursor:not-allowed}

.ticket{position:sticky;top:calc(env(safe-area-inset-top,0px) + 132px)}
@media (min-width:860px){.ticket{top:calc(env(safe-area-inset-top,0px) + 76px)}}
@media (max-width:860px){.ticket{position:static}}
.lines{display:flex;flex-direction:column}
.line{display:grid;grid-template-columns:minmax(0,1fr) auto auto;gap:4px 10px;align-items:center;padding:10px 0;border-bottom:1px dashed var(--line)}
.line .nm{font-weight:600;min-width:0;overflow-wrap:anywhere}
.line .pu{font-size:12.5px;color:var(--muted);grid-column:1}
.line .sub{font-family:var(--f-mono);font-size:14px;text-align:right;grid-column:3;grid-row:1}
.qty{display:flex;align-items:center;border:1px solid var(--line);border-radius:9px;overflow:hidden;grid-column:2/4;grid-row:2;justify-self:end}
.qty button{border:0;background:var(--sunk);width:32px;height:32px;cursor:pointer;font-size:17px;font-weight:600}
.qty input{width:44px;border:0;text-align:center;height:32px;background:var(--surface);font-family:var(--f-mono)}
.line .x{grid-column:2;grid-row:1;border:0;background:transparent;color:var(--muted);cursor:pointer;font-size:13px;text-decoration:underline}
.total{display:flex;justify-content:space-between;align-items:baseline;padding-top:4px}
.total b{font-family:var(--f-display);font-size:30px;font-weight:800;font-variant-numeric:tabular-nums}
.empty{padding:22px 10px;text-align:center;color:var(--muted);border:1.5px dashed var(--line);border-radius:12px}

.two{display:grid;grid-template-columns:1fr 1.4fr;gap:8px}
.nota{grid-column:1/-1;border:0;border-bottom:1px dotted var(--line);background:transparent;font-size:13px;padding:3px 0;color:var(--muted);width:100%}
.nota:focus{outline:none;border-bottom-color:var(--accent);color:var(--ink)}
.notaro{grid-column:1/-1;font-size:13px;color:var(--warn);font-style:italic}
.mseg{display:none}
.gobar{display:none}
.vuelto{display:flex;justify-content:space-between;align-items:baseline;padding:14px 16px;border-radius:14px;background:var(--ok-soft);color:var(--ok)}
.vuelto b{font-family:var(--f-display);font-size:34px;font-weight:800;font-variant-numeric:tabular-nums}
.vuelto.falta{background:var(--bad-soft);color:var(--bad)}
.vuelto.idle{background:var(--sunk);color:var(--muted)}
.mini-list{font-size:13.5px;display:flex;flex-direction:column;gap:3px;max-height:150px;overflow:auto;padding:10px 12px;background:var(--sunk);border-radius:10px}
.mini-list div{display:flex;justify-content:space-between;gap:10px}
@media (max-width:860px){
  .mseg{display:grid;grid-template-columns:1fr 1fr;gap:4px;background:var(--sunk);padding:4px;border-radius:11px}
  .mseg button{border:0;background:transparent;padding:10px;border-radius:8px;font-weight:600;color:var(--muted);cursor:pointer}
  .mseg button[aria-pressed="true"]{background:var(--surface);color:var(--ink);box-shadow:var(--shadow)}
  .work[data-side="pedido"] .picker{display:none}
  .work[data-side="productos"] .ticket{display:none}
  .gobar{display:flex;position:fixed;left:0;right:0;bottom:0;z-index:6;gap:10px;align-items:center;background:var(--ink);color:var(--bg);border:0;width:100%;cursor:pointer;font-weight:600;
    padding:14px max(16px,env(safe-area-inset-right,0px)) calc(14px + env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px))}
  .gobar .mono{margin-left:auto;font-size:16px}
  .toasts{bottom:calc(76px + env(safe-area-inset-bottom,0px))}
  .qty button{width:40px;height:40px}.qty input{height:40px}
  .mesa{min-height:84px}
}

/* Tablas */
.tablebox{overflow-x:auto;border:1px solid var(--line);border-radius:14px;background:var(--surface)}
table{width:100%;border-collapse:collapse;min-width:640px}
th{font-size:11.5px;letter-spacing:.07em;text-transform:uppercase;color:var(--muted);text-align:left;font-weight:600;padding:10px 12px;border-bottom:1px solid var(--line);background:var(--sunk)}
td{padding:10px 12px;border-bottom:1px solid var(--line);vertical-align:middle}
tr:last-child td{border-bottom:0}
td.r,th.r{text-align:right}
tr.low td:first-child{box-shadow:inset 3px 0 0 var(--warn)}
tr.out td:first-child{box-shadow:inset 3px 0 0 var(--bad)}
.tag{font-size:11px;font-weight:600;background:var(--sunk);color:var(--muted);padding:2px 7px;border-radius:6px;margin-left:6px;letter-spacing:.03em}
.bar{height:5px;border-radius:5px;background:var(--sunk);width:84px;overflow:hidden;margin-top:5px}
.bar i{display:block;height:100%;background:var(--ok)}
.bar.warn i{background:var(--warn)} .bar.bad i{background:var(--bad)}
.stockcell{display:flex;align-items:center;gap:8px}
.stockcell .mini{border:1px solid var(--line);background:var(--surface);width:28px;height:28px;border-radius:8px;cursor:pointer;font-weight:700}

.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:10px}
.stat{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:14px;display:flex;flex-direction:column;gap:4px}
.stat b{font-family:var(--f-mono);font-size:21px;font-weight:600}
.stat.hero{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.stat.hero .lbl{color:inherit;opacity:.8}

/* Modal */
.ov{position:fixed;inset:0;background:rgba(8,14,12,.5);z-index:20;display:flex;align-items:flex-end;justify-content:center;
  padding:max(16px,env(safe-area-inset-top,0px)) max(12px,env(safe-area-inset-right,0px)) max(12px,env(safe-area-inset-bottom,0px)) max(12px,env(safe-area-inset-left,0px))}
@media (min-width:600px){.ov{align-items:center}}
.modal{background:var(--surface);border-radius:18px;width:100%;max-width:460px;max-height:100%;overflow:auto;padding:20px;display:flex;flex-direction:column;gap:14px;box-shadow:0 20px 60px rgba(0,0,0,.3)}
.modal.wide{max-width:560px}
.seg{display:grid;grid-template-columns:repeat(auto-fit,minmax(86px,1fr));gap:6px}
.seg button{border:1px solid var(--line);background:var(--surface);border-radius:10px;padding:10px 6px;font-weight:600;cursor:pointer}
.seg button[aria-pressed="true"]{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.bigtotal{text-align:center;padding:10px;background:var(--sunk);border-radius:12px}
.bigtotal b{display:block;font-family:var(--f-display);font-size:38px;font-weight:800;font-variant-numeric:tabular-nums}
.diff{display:flex;justify-content:space-between;padding:10px 12px;border-radius:10px;font-weight:600}
.diff.ok{background:var(--ok-soft);color:var(--ok)} .diff.warn{background:var(--warn-soft);color:var(--warn)} .diff.bad{background:var(--bad-soft);color:var(--bad)}

/* Boleta */
.receipt{background:var(--paper);color:var(--paper-ink);font-family:var(--f-mono);font-size:12.5px;line-height:1.55;padding:20px 18px 24px;border-radius:4px;position:relative;border-bottom:6px dotted var(--paper-line)}
.receipt .c{text-align:center}
.receipt .h{font-family:var(--f-display);font-weight:800;font-size:17px;letter-spacing:.01em}
.receipt hr{border:0;border-top:1px dashed var(--paper-line);margin:8px 0}
.receipt .kv{display:flex;justify-content:space-between;gap:10px}
.receipt .it{display:grid;grid-template-columns:28px minmax(0,1fr) auto;gap:6px}
.receipt .tot{font-size:15px;font-weight:600}
.stamp{display:inline-block;border:2px solid currentColor;padding:2px 10px;border-radius:4px;font-weight:600;letter-spacing:.1em;transform:rotate(-3deg);margin:8px 0}
.stamp.paid{color:#1c7445} .stamp.pend{color:#975400} .stamp.void{color:#b3261e}
.receipt small{display:block;font-size:10.5px;color:#6b675c;margin-top:10px;text-align:center}

.toasts{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(16px + env(safe-area-inset-bottom,0px));z-index:30;display:flex;flex-direction:column;gap:8px;width:min(440px,calc(100% - 32px))}
.toast{background:var(--ink);color:var(--bg);padding:11px 14px;border-radius:12px;box-shadow:var(--shadow);font-weight:500;animation:up .2s ease-out}
.toast.warn{background:var(--warn);color:#fff} .toast.bad{background:var(--bad);color:#fff}
@keyframes up{from{transform:translateY(8px);opacity:.4}to{transform:none;opacity:1}}
@media (prefers-reduced-motion:reduce){.toast{animation:none}}
.note{font-size:12.5px;color:var(--muted);text-align:center}
</style>
</head>
<body>

<header class="top"><div class="top-in" id="top"></div></header>
<main><div class="wrap" id="app"></div></main>
<div id="modal"></div>
<div class="toasts" id="toasts" aria-live="polite"></div>

<script>
(function(){
const COLS=['productos','mesas','ventas','cajas','config'];
const MESAS=[{id:'m1',n:'Mesa 1'},{id:'m2',n:'Mesa 2'},{id:'m3',n:'Mesa 3'},{id:'m4',n:'Mesa 4'},{id:'m5',n:'Mesa 5'},{id:'llevar',n:'Para llevar'}];
const METODOS=['Efectivo','Yape','Plin','Tarjeta','Transferencia'];
const LS='cajaVirtual.v1';
let S={productos:{},mesas:{},ventas:{},cajas:{},config:{}};
let ui={tab:'mesas',mesa:'m1',mside:'productos',cat:'Todas',q:'',pq:'',vf:'caja',modal:null};
let db=null, mode='loading', note='';

const $=id=>document.getElementById(id);
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const money=n=>'S/ '+(Math.round((Number(n)||0)*100)/100).toFixed(2);
const uid=()=>Date.now().toString(36)+Math.random().toString(36).slice(2,7);
const clone=o=>JSON.parse(JSON.stringify(o));
const hora=iso=>iso?new Date(iso).toLocaleTimeString('es-PE',{hour:'2-digit',minute:'2-digit'}):'';
const fecha=iso=>iso?new Date(iso).toLocaleString('es-PE',{day:'2-digit',month:'2-digit',year:'numeric',hour:'2-digit',minute:'2-digit'}):'';

/* ---------- datos ---------- */
function saveLocal(){try{localStorage.setItem(LS,JSON.stringify(S))}catch(e){}}
function loadLocal(){try{const r=JSON.parse(localStorage.getItem(LS)||'null');if(r)COLS.forEach(c=>S[c]=r[c]||{})}catch(e){}}
const wq={};
function put(col,id,data){
  const next={...S[col]}; if(data===null)delete next[id]; else next[id]=data; S[col]=next;
  if(mode!=='db'){saveLocal();return}
  const k=col+'/'+id; const q=wq[k]||(wq[k]={busy:false,job:null});
  q.job={data}; if(!q.busy)flush(k,col,id);
}
async function flush(k,col,id){
  const q=wq[k]; q.busy=true;
  while(q.job){const j=q.job;q.job=null;const ref=db.collection(col).doc(id);
    try{ j.data===null?await ref.delete():await ref.set(j.data) }
    catch(e){ toast(e&&e.code==='quota_exceeded'?'Se llenó el espacio de datos. Borra ventas antiguas para seguir.':'No se pudo guardar el cambio. Revisa tu conexión.','bad') } }
  q.busy=false;
}
async function init(){
  mode='local'; loadLocal();
  let visto=false; try{visto=!!localStorage.getItem(LS)}catch(e){}
  if(!visto&&!Object.keys(S.productos).length){

/* ---------- consultas ---------- */
const neg=()=>({nombre:'Mi negocio',ruc:'',direccion:'',serie:'B001',siguiente:1,...(S.config.negocio||{})});
const caja=()=>S.config.caja||{abierta:false};
const prods=()=>Object.entries(S.productos).map(([id,p])=>({id,...p})).sort((a,b)=>String(a.nombre).localeCompare(b.nombre));
const mesa=id=>{const m=S.mesas[id];return m?clone(m):{items:[],ventaPendiente:null}};
const ventas=()=>Object.entries(S.ventas).map(([id,v])=>({id,...v})).sort((a,b)=>String(b.fecha).localeCompare(a.fecha));
function reservado(pid,salvo){let n=0;for(const[mid,m]of Object.entries(S.mesas)){if(mid===salvo)continue;for(const it of(m.items||[]))if(it.pid===pid)n+=it.cant}return n}
function enMesa(mid,pid){const it=(S.mesas[mid]?.items||[]).find(i=>i.pid===pid);return it?it.cant:0}
function nivel(p){const s=Number(p.stock)||0;if(s<=0)return'out';if(s<=(Number(p.minimo)||0))return'low';return'ok'}
const alertas=()=>prods().filter(p=>nivel(p)!=='ok');
const totalMesa=m=>(m.items||[]).reduce((a,it)=>{const p=S.productos[it.pid];return a+(p?Number(p.precio):0)*it.cant},0);
const numBoleta=v=>v.serie+'-'+String(v.numero).padStart(8,'0');
function resumenCaja(cid){
  const vs=ventas().filter(v=>v.cajaId===cid);
  const pag=vs.filter(v=>v.estado==='pagada');
  const por={};METODOS.forEach(m=>por[m]=0);pag.forEach(v=>por[v.metodo]=(por[v.metodo]||0)+v.total);
  return{pagadas:pag.length,cobrado:pag.reduce((a,v)=>a+v.total,0),por,pend:vs.filter(v=>v.estado==='pendiente')};
}

/* ---------- acciones ---------- */
function setQty(mid,pid,n){
  const m=mesa(mid); if(m.ventaPendiente){toast('Esta mesa ya tiene boleta emitida. Toca “Modificar pedido” para cambiarlo.','warn');return}
  const p=S.productos[pid]; if(!p)return;
  n=Math.max(0,Math.floor(Number(n)||0));
  const max=Math.max(0,(Number(p.stock)||0)-reservado(pid,mid));
  if(n>max){toast(max>0?`Solo hay ${max} de ${p.nombre} disponibles.`:`${p.nombre} está agotado.`,'warn');n=max}
  const i=m.items.findIndex(x=>x.pid===pid);
  if(n<=0){if(i>=0)m.items.splice(i,1)}else if(i>=0)m.items[i].cant=n;else m.items.push({pid,cant:n});
  if(!m.abiertaEn&&m.items.length)m.abiertaEn=new Date().toISOString();
  if(!m.items.length)m.abiertaEn=null;
  put('mesas',mid,m);render();
}
function completar(mid,metodo,recibido){
  if(!caja().abierta){toast('Abre la caja para cobrar.','warn');return}
  const m=mesa(mid); if(!m.items.length&&!m.ventaPendiente)return;
  const id=m.ventaPendiente||emitir(mid,false); if(!id)return;
  confirmarPago(id,metodo,recibido);
  ui.modal={k:'boleta',id}; ui.mside='productos'; render();
}
function cancelarPedido(mid){
  const m=mesa(mid);
  if(m.ventaPendiente){const v=S.ventas[m.ventaPendiente];if(v&&v.estado==='pendiente')put('ventas',m.ventaPendiente,{...clone(v),estado:'anulada',anuladaEn:new Date().toISOString()})}
  put('mesas',mid,{items:[],ventaPendiente:null,abiertaEn:null});
  ui.modal=null;ui.mside='productos';render();toast(`Pedido de ${MESAS.find(x=>x.id===mid).n} cancelado.`);
}
function emitir(mid,abrir=true){
  const c=caja(); if(!c.abierta){toast('Abre la caja antes de emitir boletas.','warn');return}
  const m=mesa(mid); if(!m.items.length)return;
  const N=neg(); const items=m.items.filter(it=>S.productos[it.pid]).map(it=>{const p=S.productos[it.pid];return{pid:it.pid,nombre:p.nombre,precio:Number(p.precio),cant:it.cant,...(it.nota?{nota:it.nota}:{})}});
  const total=Math.round(items.reduce((a,i)=>a+i.precio*i.cant,0)*100)/100;
  const id=uid();
  const v={serie:N.serie,numero:N.siguiente,fecha:new Date().toISOString(),mesaId:mid,mesa:MESAS.find(x=>x.id===mid).n,items,total,estado:'pendiente',cajaId:c.id};
  put('ventas',id,v); put('config','negocio',{...N,siguiente:N.siguiente+1});
  m.ventaPendiente=id; put('mesas',mid,m);
  if(abrir){ui.modal={k:'boleta',id}; render()}
  return id;
}
function confirmarPago(id,metodo,recibido){
  const v=S.ventas[id]; if(!v||v.estado!=='pendiente')return;
  if(!caja().abierta){toast('Abre la caja para registrar el pago.','warn');return}
  const nv={...clone(v),estado:'pagada',metodo,pagadaEn:new Date().toISOString(),cajaId:caja().id};
  if(metodo==='Efectivo'){const r=Number(recibido)||v.total;nv.recibido=r;nv.vuelto=Math.max(0,Math.round((r-v.total)*100)/100)}
  put('ventas',id,nv);
  const nuevos=[];
  for(const it of v.items){const p=S.productos[it.pid];if(!p)continue;const antes=nivel(p);const np={...clone(p),stock:Math.max(0,(Number(p.stock)||0)-it.cant)};put('productos',it.pid,np);const des=nivel(np);if(des!=='ok'&&antes!==des)nuevos.push(np)}
  const m=S.mesas[v.mesaId]; if(m&&m.ventaPendiente===id)put('mesas',v.mesaId,{items:[],ventaPendiente:null,abiertaEn:null});
  ui.modal=null; render();
  toast(`Pago confirmado: ${numBoleta(v)} · ${money(v.total)}`+(nv.vuelto?` · vuelto ${money(nv.vuelto)}`:''));
  nuevos.forEach(p=>toast(p.stock<=0?`${p.nombre} se agotó.`:`${p.nombre} está por acabarse: quedan ${p.stock}.`,p.stock<=0?'bad':'warn'));
}
function anular(id){
  const v=S.ventas[id]; if(!v||v.estado!=='pendiente')return;
  put('ventas',id,{...clone(v),estado:'anulada',anuladaEn:new Date().toISOString()});
  const m=S.mesas[v.mesaId]; if(m&&m.ventaPendiente===id)put('mesas',v.mesaId,{...clone(m),ventaPendiente:null});
  ui.modal=null;render();toast(`Boleta ${numBoleta(v)} anulada. El pedido sigue en ${v.mesa}.`);
}
function abrirCaja(){
  const m=Number(($('apertura')||{}).value)||0;
  put('config','caja',{abierta:true,id:uid(),apertura:m,abiertaEn:new Date().toISOString()});
  render();toast(`Caja abierta con ${money(m)}.`);

function cerrarCaja(contado){
  const c=caja(); if(!c.abierta)return; const r=resumenCaja(c.id);
  const esperado=c.apertura+r.por.Efectivo; const ct=Number(contado)||0;
  put('cajas',c.id,{apertura:c.apertura,abiertaEn:c.abiertaEn,cerradaEn:new Date().toISOString(),boletas:r.pagadas,cobrado:r.cobrado,porMetodo:r.por,esperado,contado:ct,diferencia:Math.round((ct-esperado)*100)/100});
  put('config','caja',{abierta:false,ultima:c.id});
  ui.modal=null;render();toast(`Caja cerrada. Vendiste ${money(r.cobrado)} en ${r.pagadas} boleta${r.pagadas===1?'':'s'}.`);toast('Recuerda descargar tu respaldo en la sección Caja.','warn');
}
function guardarProd(){

/* ---------- render ---------- */
function render(){
  const a=document.activeElement, id=a&&a.id; let s=null,e=null; try{s=a.selectionStart;e=a.selectionEnd}catch(_){}
  $('top').innerHTML=topView(); $('app').innerHTML=view(); $('modal').innerHTML=modalView();
  if(id){const el=$(id);if(el&&el!==document.activeElement){el.focus();try{if(s!=null)el.setSelectionRange(s,e)}catch(_){}}}
}
function toast(msg,kind){const t=document.createElement('div');t.className='toast '+(kind||'');t.textContent=msg;$('toasts').appendChild(t);setTimeout(()=>t.remove(),kind?5200:3200)}

document.addEventListener('click',ev=>{
  const b=ev.target.closest('[data-act]'); if(!b)return; const act=b.dataset.act, v=b.dataset.v;
  if(act==='ov'){if(ev.target===b){ui.modal=null;render()}return}
  switch(act){
    case'tab':ui.tab=v;ui.modal=null;break;
    case'mesa':ui.mesa=v;ui.mside=(S.mesas[v]?.items||[]).length?'pedido':'productos';break;
    case'mside':ui.mside=v;window.scrollTo({top:0});break;
    case'completar':if(!caja().abierta){toast('Abre la caja para cobrar.','warn');ui.tab='caja';break}ui.modal={k:'completar',mid:ui.mesa,f:{metodo:'Efectivo',recibido:''}};break;
    case'okCompletar':completar(ui.modal.mid,ui.modal.f.metodo,ui.modal.f.recibido);return;
    case'cancelarPed':ui.modal={k:'cancelarPed',mid:ui.mesa};break;
    case'okCancelarPed':cancelarPedido(ui.modal.mid);return;
    case'cat':ui.cat=v;break;
    case'vf':ui.vf=v;break;
    case'add':setQty(ui.mesa,v,enMesa(ui.mesa,v)+1);return;
    case'inc':setQty(ui.mesa,v,enMesa(ui.mesa,v)+1);return;
    case'dec':setQty(ui.mesa,v,enMesa(ui.mesa,v)-1);return;
    case'rm':setQty(ui.mesa,v,0);return;
    case'vaciar':put('mesas',ui.mesa,{items:[],ventaPendiente:null,abiertaEn:null});break;
    case'emitir':emitir(ui.mesa);return;
    case'boleta':ui.modal={k:'boleta',id:v};break;
    case'pagar':if(!caja().abierta){toast('Abre la caja para registrar pagos.','warn');return}ui.modal={k:'pago',id:v,f:{metodo:'Efectivo',recibido:''}};break;
    case'metodo':ui.modal.f.metodo=v;break;
    case'rec':ui.modal.f.recibido=String(v);break;
    case'okPago':confirmarPago(ui.modal.id,ui.modal.f.metodo,ui.modal.f.recibido);return;
    case'anular':ui.modal={k:'anular',id:v};break;
    case'okAnular':anular(v);return;
    case'nuevoProd':ui.modal={k:'prod',id:null,f:{nombre:'',categoria:'',precio:'',stock:'',minimo:'5'}};break;
    case'editProd':{const p=S.productos[v];ui.modal={k:'prod',id:v,f:{nombre:p.nombre,categoria:p.categoria,precio:String(p.precio),stock:String(p.stock),minimo:String(p.minimo)}};break}
    case'okProd':guardarProd();return;
    case'borrarProd':ui.modal.borrar=true;break;
    case'okBorrar':{const n=S.productos[ui.modal.id]?.nombre;put('productos',ui.modal.id,null);ui.modal=null;toast(`${n} borrado.`);break}
    case'borrarEj':prods().filter(p=>p.ejemplo).forEach(p=>put('productos',p.id,null));toast('Productos de ejemplo borrados.');break;
    case'reponer':ui.modal={k:'reponer',id:v,f:{cant:''}};break;
    case'okReponer':{const n=Math.floor(Number(ui.modal.f.cant));const p=S.productos[ui.modal.id];ajustarStock(ui.modal.id,n);ui.modal=null;toast(`+${n} ${p.nombre}. Ahora tienes ${(Number(p.stock)||0)+n}.`);break}
    case'stk':ajustarStock(v,Number(b.dataset.d));return;
    case'abrirCaja':abrirCaja();return;
    case'cerrarCaja':ui.modal={k:'cerrar',f:{contado:''}};break;
    case'okCerrar':cerrarCaja(ui.modal.f.contado);return;
    case'alertas':ui.modal={k:'alertas'};break;
    case'copiar':{const t=receiptText(S.ventas[v]);try{navigator.clipboard.writeText(t).then(()=>toast('Boleta copiada.'),()=>toast('No se pudo copiar en este navegador.','warn'))}catch(_){toast('No se pudo copiar en este navegador.','warn')}return}
    case'cerrarModal':ui.modal=null;break;
    case'respaldo':descargarRespaldo();return;
    case'okRestaurar':{const d=ui.modal.datos;COLS.forEach(c=>S[c]=d[c]||{});saveLocal();ui.modal=null;toast('Respaldo restaurado.');break}
  }
  render();
});
document.addEventListener('input',ev=>{
  const t=ev.target;
  if(t.dataset.in){ui[t.dataset.in]=t.value;render();return}
  if(t.dataset.mf&&ui.modal){ui.modal.f[t.dataset.mf]=t.value;if(t.dataset.live!==undefined)render();return}
});
document.addEventListener('change',ev=>{
  const t=ev.target;
  if(t.dataset.restore!==undefined&&t.files&&t.files[0]){restaurar(t.files[0]);t.value='';return}
  if(t.dataset.qty){setQty(ui.mesa,t.dataset.qty,t.value);return}
  if(t.dataset.nota){const m=mesa(ui.mesa);const it=m.items.find(i=>i.pid===t.dataset.nota);if(it){const n=t.value.trim();if(n)it.nota=n;else delete it.nota;put('mesas',ui.mesa,m);render()}return}
  if(t.dataset.neg){const N=neg();let val=t.value.trim();if(t.dataset.neg==='serie')val=val.toUpperCase()||'B001';if(t.dataset.neg==='nombre')val=val||'Mi negocio';put('config','negocio',{...N,[t.dataset.neg]:val});render();toast('Datos del negocio guardados.')}
});
document.addEventListener('keydown',ev=>{
  if(ev.key==='Escape'&&ui.modal){ui.modal=null;render()}
  if(ev.key==='Enter'&&ev.target.id==='apertura')abrirCaja();
});
init();
})();
</script>

</body>
</html>
